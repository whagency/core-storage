# Main
listen_addresses = '0.0.0.0'

# Memory
shared_buffers = 4GB               # Usually 25-40% of RAM
work_mem = 8MB                     # Setting for sorting operations, can be increased for complex queries.
maintenance_work_mem = 1GB         # Memory for VACUUM, CREATE INDEX, etc. operations.

# Caching
effective_cache_size = 12GB        # Approximately 75% of RAM, to predict file system usage.

# Autovacuum settings
autovacuum_max_workers = 6
autovacuum_naptime = 5s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05

# Connection parameters
max_connections = 300
idle_in_transaction_session_timeout = 30s

# WAL and journaling
synchronous_commit = off
wal_buffers = 16MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB

# CPU parameters
max_parallel_workers_per_gather = 2
max_worker_processes = 8
max_parallel_workers = 4

# Logs
log_min_duration_statement = 1000   # Logging long queries in milliseconds.
log_statement = 'none'

# Log rotation
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%a.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on
logging_collector = on
log_duration = off

# pg_stat_statements
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
